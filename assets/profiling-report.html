<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transaction profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #111719;
      --surface: #172023;
      --line: #344348;
      --text: #e6eeee;
      --muted: #9aadaf;
      --accent: #bedcd0;
      --sans: 'IBM Plex Sans', sans-serif;
      --mono: 'IBM Plex Mono', monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans); }
    main { max-width: 1600px; margin: 0 auto; padding: 42px 36px 28px; }
    header { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; padding-bottom: 26px; }
    h1 { margin: 0; font-size: 32px; line-height: 1.2; letter-spacing: -.035em; font-weight: 500; }
    #configuration, #machine { color: var(--muted); margin: 9px 0 0; font: 12px/1.6 var(--mono); }
    #repetitions { color: var(--muted); white-space: nowrap; font: 12px var(--mono); }
    .toolbar { border-block: 1px solid var(--line); display: flex; gap: 18px; align-items: center; padding: 16px 0; flex-wrap: wrap; }
    .transaction { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 220px; }
    label { color: var(--muted); font-size: 12px; }
    select { max-width: 520px; min-width: 150px; width: 100%; text-overflow: ellipsis; }
    button, select { background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; font: 12px var(--mono); }
    button { cursor: pointer; }
    button:hover { border-color: var(--muted); }
    button:focus-visible, select:focus-visible, canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .axis { display: flex; align-items: center; gap: 10px; }
    .segments { display: flex; }
    .segments button { border-radius: 0; }
    .segments button:first-child { border-radius: 4px 0 0 4px; }
    .segments button:last-child { border-radius: 0 4px 4px 0; border-left: 0; }
    .segments button[aria-pressed="true"] { color: #15211e; background: var(--accent); border-color: var(--accent); }
    .zoom { display: flex; gap: 6px; }
    .zoom button { min-width: 34px; }
    #status { color: var(--muted); padding: 60px 0; text-align: center; }
    #transaction-totals { display: flex; flex-wrap: wrap; gap: 12px 28px; margin-top: 24px; color: var(--muted); font: 12px var(--mono); }
    #transaction-totals strong { margin-left: 8px; color: var(--text); font-weight: 400; }
    #chart { position: relative; margin-top: 20px; }
    #opcode-summary { margin-top: 32px; overflow-x: auto; }
    #opcode-summary table { width: 100%; min-width: 620px; border-collapse: collapse; font-size: 12px; }
    #opcode-summary caption { padding-bottom: 12px; text-align: left; color: var(--muted); }
    #opcode-summary th, #opcode-summary td { padding: 12px 14px; text-align: right; border-bottom: 1px solid var(--line); }
    #opcode-summary thead th { color: var(--muted); font-weight: 400; border-top: 1px solid var(--line); }
    #opcode-summary thead button { width: 100%; border: 0; padding: 0; background: none; color: inherit; font: inherit; text-align: inherit; }
    #opcode-summary thead button:hover, #opcode-summary th[aria-sort] { color: var(--text); }
    .sort-arrow { margin-left: 5px; }
    #opcode-summary th:first-child { padding-left: 0; text-align: left; white-space: nowrap; }
    #opcode-summary th:last-child, #opcode-summary td:last-child { padding-right: 0; }
    #opcode-summary tbody { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    #opcode-summary tbody th { font-weight: 500; }
    #opcode-summary tbody tr:hover { background: var(--surface); }
    .opcode-code { color: var(--muted); margin-right: 10px; }
    .opcode-color { display: inline-block; width: 8px; height: 8px; margin-right: 10px; border-radius: 2px; }
    .table-unit { display: block; margin-top: 3px; font: 11px var(--mono); }
    canvas { display: block; width: 100%; touch-action: none; cursor: crosshair; }
    #highlight { position: absolute; border: 2px solid #fff; border-radius: 3px; pointer-events: none; display: none; }
    #tooltip { position: fixed; z-index: 5; width: max-content; min-width: 275px; max-width: min(460px, calc(100vw - 24px)); background: #202c30; border: 1px solid #64777b; border-radius: 6px; padding: 16px 18px; box-shadow: 0 8px 28px #0005; pointer-events: none; }
    #tooltip[hidden] { display: none; }
    .tip-heading { display: flex; align-items: baseline; gap: 12px; }
    #tip-opcode { color: var(--muted); font: 12px var(--mono); }
    #tip-name { font: 600 17px var(--mono); overflow-wrap: anywhere; }
    #tip-contract { margin: 7px 0 14px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; white-space: pre-line; }
    dl { display: grid; grid-template-columns: auto auto; gap: 7px 20px; margin: 0; font-size: 12px; }
    dt { color: var(--muted); }
    dd { text-align: right; margin: 0; font-family: var(--mono); }
    #tip-scope { color: var(--muted); font-size: 11px; margin: 12px 0 0; }
    [hidden] { display: none !important; }
    @media (max-width: 760px) {
      main { padding: 26px 16px; }
      header { align-items: flex-start; flex-direction: column; gap: 12px; }
      h1 { font-size: 27px; }
      .transaction { flex-basis: 100%; }
      .axis { margin-right: auto; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div><h1 id="title">Transaction profile</h1><p id="machine"></p><p id="configuration"></p></div>
    <div id="repetitions"></div>
  </header>
  <div class="toolbar" id="toolbar" hidden>
    <div class="transaction"><label for="transaction">Repeat step</label><select id="transaction"></select></div>
    <div class="axis"><label>X-axis</label><div class="segments" role="group" aria-label="X-axis metric">
      <button id="ref-time" type="button" aria-pressed="true">Ref time</button>
      <button id="execution-time" type="button" aria-pressed="false">Execution time</button>
    </div></div>
    <div class="zoom" role="group" aria-label="Zoom">
      <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
      <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
      <button id="fit" type="button">Fit all</button>
    </div>
  </div>
  <p id="status" role="status">Loading profiling data…</p>
  <div id="transaction-totals" hidden title="Per transaction, across the recorded opcode interval. Execution time is the mean ± sample standard deviation. Runtime work before the first opcode and after the last is not recorded.">
    <span>Ref time total<strong id="transaction-ref-time"></strong></span>
    <span>Execution time total<strong id="transaction-execution-time"></strong></span>
  </div>
  <div id="chart" hidden>
    <canvas id="flame" tabindex="0" role="img" aria-label="Opcode flame graph. Arrow keys select opcodes. Enter zooms to the selected opcode. Home fits all."></canvas>
    <div id="highlight"></div>
  </div>
  <div id="opcode-summary" hidden>
    <table aria-label="Opcode totals per transaction, excluding call and creation opcodes">
      <caption>Per transaction</caption>
      <thead><tr>
        <th scope="col"><button type="button" data-sort="code">Opcode<span class="sort-arrow" aria-hidden="true">↕</span></button></th>
        <th scope="col"><button type="button" data-sort="refTime">Ref time total<span class="sort-arrow" aria-hidden="true">↕</span><span class="table-unit">ms</span></button></th>
        <th scope="col"><button type="button" data-sort="executionTime">Execution time total<span class="sort-arrow" aria-hidden="true">↕</span><span class="table-unit">ms</span></button></th>
        <th scope="col" aria-sort="descending"><button type="button" data-sort="difference">Ref time − execution time<span class="sort-arrow" aria-hidden="true">↓</span><span class="table-unit">ms</span></button></th>
      </tr></thead>
      <tbody id="opcode-totals"></tbody>
    </table>
  </div>
</main>
<aside id="tooltip" role="tooltip" hidden>
  <div class="tip-heading"><span id="tip-opcode"></span><span id="tip-name"></span></div>
  <p id="tip-contract"></p>
  <dl><dt>Ref time</dt><dd id="tip-weight"></dd><dt>Proof size</dt><dd id="tip-proof"></dd><dt>Execution time</dt><dd id="tip-time"></dd></dl>
  <p id="tip-scope"></p>
</aside>
<!-- PROFILING_DATA -->
<script>
'use strict';

const OPCODES = {
  0x00:'STOP',0x01:'ADD',0x02:'MUL',0x03:'SUB',0x04:'DIV',0x05:'SDIV',0x06:'MOD',0x07:'SMOD',
  0x08:'ADDMOD',0x09:'MULMOD',0x0a:'EXP',0x0b:'SIGNEXTEND',0x10:'LT',0x11:'GT',0x12:'SLT',
  0x13:'SGT',0x14:'EQ',0x15:'ISZERO',0x16:'AND',0x17:'OR',0x18:'XOR',0x19:'NOT',0x1a:'BYTE',
  0x1b:'SHL',0x1c:'SHR',0x1d:'SAR',0x20:'KECCAK256',0x30:'ADDRESS',0x31:'BALANCE',0x32:'ORIGIN',
  0x33:'CALLER',0x34:'CALLVALUE',0x35:'CALLDATALOAD',0x36:'CALLDATASIZE',0x37:'CALLDATACOPY',
  0x38:'CODESIZE',0x39:'CODECOPY',0x3a:'GASPRICE',0x3b:'EXTCODESIZE',0x3c:'EXTCODECOPY',
  0x3d:'RETURNDATASIZE',0x3e:'RETURNDATACOPY',0x3f:'EXTCODEHASH',0x40:'BLOCKHASH',0x41:'COINBASE',
  0x42:'TIMESTAMP',0x43:'NUMBER',0x44:'PREVRANDAO',0x45:'GASLIMIT',0x46:'CHAINID',0x47:'SELFBALANCE',
  0x48:'BASEFEE',0x49:'BLOBHASH',0x4a:'BLOBBASEFEE',0x50:'POP',0x51:'MLOAD',0x52:'MSTORE',
  0x53:'MSTORE8',0x54:'SLOAD',0x55:'SSTORE',0x56:'JUMP',0x57:'JUMPI',0x58:'PC',0x59:'MSIZE',
  0x5a:'GAS',0x5b:'JUMPDEST',0x5c:'TLOAD',0x5d:'TSTORE',0x5e:'MCOPY',0x5f:'PUSH0',
  0xf0:'CREATE',0xf1:'CALL',0xf2:'CALLCODE',0xf3:'RETURN',0xf4:'DELEGATECALL',0xf5:'CREATE2',
  0xfa:'STATICCALL',0xfd:'REVERT',0xfe:'INVALID',0xff:'SELFDESTRUCT'
};
for (let i=1; i<=32; i++) OPCODES[0x5f+i] = `PUSH${i}`;
for (let i=1; i<=16; i++) { OPCODES[0x7f+i] = `DUP${i}`; OPCODES[0x8f+i] = `SWAP${i}`; }
for (let i=0; i<=4; i++) OPCODES[0xa0+i] = `LOG${i}`;
const CALLS = new Set([0xf0,0xf1,0xf2,0xf4,0xf5,0xfa]);
const PRECOMPILES = Object.fromEntries(Object.entries({
  1:'ECRecover',2:'SHA256',3:'RIPEMD160',4:'Identity',5:'ModExp',6:'BN128Add',7:'BN128Mul',
  8:'BN128Pairing',9:'Blake2F',10:'PointEval',256:'P256Verify'
}).map(([address,name]) => [`0x${Number(address).toString(16).padStart(40,'0')}`,name]));
const ROW = 76, BAR = 38, LEFT = 64, RIGHT = 12, TOP = 16;
const $ = id => document.getElementById(id);
const canvas = $('flame'), context = canvas.getContext('2d');
const number = new Intl.NumberFormat('en-US', { maximumFractionDigits: 3 });
const whole = new Intl.NumberFormat('en-US');
const milliseconds = new Intl.NumberFormat('en-US', { minimumFractionDigits: 3, maximumFractionDigits: 9 });
let report, choices, selected, frames, owners, stats, maxDepth;
let metric = 'ref', starts, widths, total, view, painted = [], width, height, drag, active;
let opcodeSort = {key:'difference', direction:'descending'};
let loadRevision = 0;

function requireValue(condition, message) { if (!condition) throw new Error(message); }
function opcodeName(code) { return OPCODES[code] || 'UNKNOWN'; }
function opcodeHex(code) { return `0x${code.toString(16).padStart(2,'0').toUpperCase()}`; }
function selectorHex(selector) { return selector?.map(byte => byte.toString(16).padStart(2,'0')).join(''); }
function modeName(mode) {
  const pipeline = {ViaYulIR:'Y', ViaNewYorkIR:'NY', ViaEVMAssembly:'E'}[mode.pipeline];
  return `${pipeline} ${mode.optimize_setting.level} S${mode.optimize_setting.solc_optimizer_enabled?'+':'-'}`;
}
function machineDescription(machine) {
  if (!machine) return 'Machine information not recorded';
  const details = [...machine.cpu_models];
  if (machine.physical_cores) details.push(`${whole.format(machine.physical_cores)} reported cores`);
  if (machine.logical_cpus) details.push(`${whole.format(machine.logical_cpus)} logical threads`);
  if (machine.available_parallelism && machine.available_parallelism!==machine.logical_cpus) {
    details.push(`${whole.format(machine.available_parallelism)} available CPU${machine.available_parallelism===1?'':'s'}`);
  }
  const frequencies = machine.reported_cpu_frequencies_mhz;
  if (frequencies.length) {
    const first=frequencies[0], last=frequencies[frequencies.length-1];
    details.push(`${whole.format(first)}${last===first?'':` to ${whole.format(last)}`} MHz snapshot`);
  }
  if (machine.memory_bytes) details.push(`${number.format(machine.memory_bytes/1024**3)} GiB RAM`);
  if (machine.operating_system) details.push(machine.operating_system);
  if (machine.kernel_version) details.push(`Kernel ${machine.kernel_version}`);
  if (machine.architecture) details.push(machine.architecture);
  return details.join(' · ') || 'Machine information not recorded';
}
function opcodeColor(code) {
  const fixed = { 0x39:'#1163a0', 0x02:'#6543ba', 0x57:'#a92351', 0x5b:'#067265', 0x01:'#9743a7', 0xfa:'#ae6106', 0xf1:'#be7326' };
  return fixed[code] || `hsl(${(code * 137.508) % 360} 46% 37%)`;
}
function unitFor(ns) {
  return ns >= 1e9 ? {divisor:1e9,name:'s'} : ns >= 1e6 ? {divisor:1e6,name:'ms'}
    : ns >= 1e3 ? {divisor:1e3,name:'µs'} : {divisor:1,name:'ns'};
}
function duration(ns, sd) {
  const unit = unitFor(ns);
  return `${number.format(ns/unit.divisor)}${sd === undefined ? '' : ` ± ${sd === null ? '—' : number.format(sd/unit.divisor)}`} ${unit.name}`;
}
function callName(call, workload) {
  const address = call.code_address?.toLowerCase();
  if (PRECOMPILES[address]) return `${PRECOMPILES[address]} precompile`;
  const selector = selectorHex(call.selector);
  const contract = address && workload.deployments?.[address];
  const matches = (selector && workload.function_names[selector] || []).filter(name => !contract || name.startsWith(`${contract}.`));
  if (contract) return matches.length ? matches.join(' / ') : `${contract}.${selector ? `0x${selector}` : 'fallback'}`;
  if (address) return `Unknown contract · ${address}`;
  return matches.length === 1 ? matches[0] : selector ? `Unknown contract · 0x${selector}` : 'Call without a selector';
}

async function summarize(group) {
  const count = group.op_codes.length;
  const startMean = new Float64Array(count), elapsedMean = new Float64Array(count), m2 = new Float64Array(count);
  const opcodeTotals = [], rootIndices = [];
  let transactionMean = 0, transactionM2 = 0;
  requireValue(group.samples.length > 0, 'No timing samples in this repeat step.');
  for (const [index, code] of group.op_codes.entries()) {
    const totals = opcodeTotals[code] ??= {code, refTime:0, executionTime:0, executionM2:0};
    totals.refTime += group.weights[index].ref_time;
    if (group.depths[index]===0) rootIndices.push(index);
  }
  requireValue(rootIndices.length>0, 'No entry-point opcodes in this repeat step.');
  const transactionRefTime=rootIndices.reduce((sum,index) => sum+group.weights[index].ref_time,0);
  requireValue(Number.isSafeInteger(transactionRefTime), 'The transaction weight cannot be represented exactly.');
  for (const [sampleIndex, sample] of group.samples.entries()) {
    requireValue(sample.elapsed_ns.length === count && sample.started_at_ns.length === count, 'Timing samples do not match the opcode sequence.');
    const executionTotals = new Float64Array(opcodeTotals.length);
    for (let i=0; i<count; i++) {
      const elapsed = sample.elapsed_ns[i], start = sample.started_at_ns[i];
      requireValue(Number.isSafeInteger(elapsed) && elapsed >= 0 && Number.isSafeInteger(start) && start >= 0, 'A timestamp cannot be represented exactly.');
      startMean[i] += (start-startMean[i])/(sampleIndex+1);
      const delta = elapsed-elapsedMean[i];
      elapsedMean[i] += delta/(sampleIndex+1);
      m2[i] += delta*(elapsed-elapsedMean[i]);
      executionTotals[group.op_codes[i]] += elapsed;
    }
    for (const row of opcodeTotals.filter(Boolean)) {
      const executionTime=executionTotals[row.code];
      requireValue(Number.isSafeInteger(executionTime*1000), 'An opcode total cannot be represented exactly.');
      const delta=executionTime-row.executionTime;
      row.executionTime+=delta/(sampleIndex+1);
      row.executionM2+=delta*(executionTime-row.executionTime);
    }
    const firstStart=rootIndices.reduce((start,index) => Math.min(start,sample.started_at_ns[index]),sample.started_at_ns[rootIndices[0]]);
    const lastEnd=rootIndices.reduce((end,index) => Math.max(end,sample.started_at_ns[index]+sample.elapsed_ns[index]),firstStart);
    requireValue(Number.isSafeInteger(lastEnd), 'The transaction interval cannot be represented exactly.');
    const elapsed=lastEnd-firstStart, delta=elapsed-transactionMean;
    transactionMean+=delta/(sampleIndex+1);
    transactionM2+=delta*(elapsed-transactionMean);
    if (sampleIndex % 4 === 0) await new Promise(resolve => setTimeout(resolve,0));
  }
  const sd = group.samples.length > 1 ? m2.map(value => Math.sqrt(Math.max(0,value/(group.samples.length-1)))) : null;
  const totals = opcodeTotals.filter(row => !CALLS.has(row.code)).map(({executionM2,...row}) => {
    requireValue(Number.isSafeInteger(row.refTime), 'An opcode total cannot be represented exactly.');
    const executionSd=group.samples.length>1 ? Math.sqrt(Math.max(0,executionM2/(group.samples.length-1))) : null;
    return {...row, executionSd, difference:row.refTime-row.executionTime*1000};
  });
  const transactionSd=group.samples.length>1 ? Math.sqrt(Math.max(0,transactionM2/(group.samples.length-1))) : null;
  return {startMean, elapsedMean, sd, totals, transactionTotals:{refTime:transactionRefTime,executionTime:transactionMean,executionSd:transactionSd}};
}

function renderOpcodeTotals(totals) {
  const {key,direction} = opcodeSort;
  const sorted = totals.toSorted((a,b) => (direction==='ascending'?1:-1)*(a[key]-b[key]) || a.code-b.code);
  for (const button of $('opcode-summary').querySelectorAll('button[data-sort]')) {
    const selected = button.dataset.sort===key;
    if (selected) button.parentElement.setAttribute('aria-sort',direction);
    else button.parentElement.removeAttribute('aria-sort');
    button.querySelector('.sort-arrow').textContent=selected?(direction==='ascending'?'↑':'↓'):'↕';
  }
  $('opcode-totals').replaceChildren(...sorted.map(({code,refTime,executionTime,executionSd,difference}) => {
    const row = document.createElement('tr'), opcode = document.createElement('th');
    opcode.scope = 'row';
    const color = document.createElement('span'); color.className='opcode-color'; color.style.background=opcodeColor(code);
    const hex = document.createElement('span'); hex.className='opcode-code'; hex.textContent=opcodeHex(code);
    opcode.append(color,hex,opcodeName(code)); row.append(opcode);
    const execution=milliseconds.format(executionTime/1e6)+(executionSd===null?'':` ± ${milliseconds.format(executionSd/1e6)}`);
    for (const value of [milliseconds.format(refTime/1e9), execution, `${difference>0?'+':''}${milliseconds.format(difference/1e9)}`]) {
      const cell = document.createElement('td'); cell.textContent=value; row.append(cell);
    }
    return row;
  }));
}

function buildFrames(group, workload) {
  const count = group.op_codes.length;
  requireValue(group.weights.length === count && group.depths.length === count, 'Opcode metadata lengths differ.');
  const root = {first:0,end:count,parent:null,depth:0,label:group.entry_point || 'Entry point',indices:[]};
  const result = [root, ...group.calls.map(call => ({first:call.first_opcode,end:call.end_opcode,parent:call.parent_opcode,
    depth:group.depths[call.parent_opcode]+1,label:callName(call,workload),address:call.code_address,
    precompile:PRECOMPILES[call.code_address?.toLowerCase()],indices:[]}))];
  const eventOwners = new Uint32Array(count), stack = [0];
  const nonempty = result.map((frame,index) => ({frame,index})).filter(({frame,index}) => index && frame.first < frame.end);
  let next = 0;
  for (let i=0; i<count; i++) {
    while (stack.length > 1 && i >= result[stack[stack.length-1]].end) stack.pop();
    while (next < nonempty.length && nonempty[next].frame.first === i) {
      const {frame,index} = nonempty[next++];
      requireValue(frame.depth === stack.length && frame.end <= result[stack[stack.length-1]].end, 'Call frames are not properly nested.');
      stack.push(index);
    }
    const owner = stack[stack.length-1];
    requireValue(group.depths[i] === result[owner].depth, 'Opcode depth does not match its call frame.');
    eventOwners[i] = owner;
    result[owner].indices.push(i);
    const weight = group.weights[i];
    requireValue(Number.isSafeInteger(weight.ref_time) && Number.isSafeInteger(weight.proof_size), 'A weight cannot be represented exactly.');
  }
  requireValue(next === nonempty.length, 'A call frame is outside the opcode sequence.');
  return {frames:result,owners:eventOwners};
}

function layout() {
  const group = selected.group, count = group.op_codes.length;
  starts = new Float64Array(count); widths = new Float64Array(count);
  if (metric === 'ref') {
    const cursors = new Float64Array(frames.length);
    for (let i=0; i<count; i++) {
      const owner = owners[i], frame = frames[owner];
      if (frame.parent !== null && frame.first === i) cursors[owner] = starts[frame.parent];
      starts[i] = cursors[owner]; widths[i] = group.weights[i].ref_time / 1000;
      cursors[owner] += widths[i];
    }
    total = cursors[0];
  } else {
    const origin = stats.startMean[0];
    for (let i=0; i<count; i++) { starts[i] = stats.startMean[i]-origin; widths[i] = stats.elapsedMean[i]; }
    total = frames[0].indices.reduce((end,index) => Math.max(end,starts[index]+widths[index]),0);
  }
  for (const frame of frames) {
    if (frame.indices.length) {
      frame.start = starts[frame.indices[0]];
      const last = frame.indices[frame.indices.length-1];
      frame.endPosition = starts[last]+widths[last];
    } else {
      frame.start = starts[frame.parent];
      frame.endPosition = frame.start+widths[frame.parent];
    }
    if (frame.parent !== null && metric === 'ref') {
      requireValue(frame.endPosition <= starts[frame.parent]+widths[frame.parent]+0.001, 'A callee consumes more weight than its enclosing call.');
    }
  }
  total = Math.max(total,1);
  setView(0,total);
}

function setView(start,end) {
  const span = Math.min(total, Math.max(total/1e8,end-start));
  const left = Math.max(0,Math.min(total-span,start));
  view = {start:left,end:left+span};
  hideTooltip(); draw();
}
function zoom(factor, centre = (view.start+view.end)/2) {
  const fraction = (centre-view.start)/(view.end-view.start), span = (view.end-view.start)*factor;
  setView(centre-span*fraction,centre+span*(1-fraction));
}
function x(value) { return LEFT+(value-view.start)/(view.end-view.start)*(width-LEFT-RIGHT); }
function rowY(depth) { return TOP+(maxDepth-depth)*ROW; }
function roundedRect(left,top,w,h,r=2) { context.beginPath(); context.roundRect(left,top,w,h,r); context.fill(); }
function firstVisible(indices) {
  let left=0, right=indices.length;
  while (left<right) {
    const middle=(left+right)>>>1, index=indices[middle];
    if (starts[index]+widths[index] < view.start) left=middle+1; else right=middle;
  }
  return left;
}

function draw() {
  if (!frames || !view) return;
  width = $('chart').clientWidth;
  height = TOP+(maxDepth+1)*ROW+44;
  const scale = window.devicePixelRatio || 1;
  canvas.width = Math.round(width*scale); canvas.height = Math.round(height*scale);
  canvas.style.height = `${height}px`;
  context.setTransform(scale,0,0,scale,0,0);
  context.fillStyle = '#111719'; context.fillRect(0,0,width,height);
  context.font = '11px "IBM Plex Mono", monospace'; context.textBaseline = 'middle';
  context.fillStyle = '#82989c'; context.fillText('DEPTH',0,7);
  for (let depth=0; depth<=maxDepth; depth++) context.fillText(String(depth).padStart(2,'0'),12,rowY(depth)+BAR/2);
  const axisY = height-30, unit = unitFor(view.end-view.start);
  for (let tick=0; tick<=4; tick++) {
    const value = view.start+(view.end-view.start)*tick/4, position=x(value);
    context.strokeStyle = '#253135'; context.beginPath(); context.moveTo(position,TOP); context.lineTo(position,axisY-12); context.stroke();
    context.fillStyle = '#91a5a8'; context.textAlign = tick===0?'left':tick===4?'right':'center';
    context.fillText(number.format(value/unit.divisor),position,axisY);
  }
  context.textAlign = 'center';
  context.fillText(`${metric==='ref'?'Ref time':'Execution time'} (${unit.name})`,(LEFT+width-RIGHT)/2,height-8);
  context.textAlign = 'left'; painted=[];
  context.save(); context.beginPath(); context.rect(LEFT,TOP,width-LEFT-RIGHT,height-TOP); context.clip();
  for (const [frameIndex,frame] of frames.entries()) {
    if (frame.endPosition < view.start || frame.start > view.end) continue;
    const y=rowY(frame.depth), left=Math.max(LEFT,x(frame.start)), right=Math.min(width-RIGHT,x(frame.endPosition));
    let lastPixel = -1;
    for (let at=firstVisible(frame.indices); at<frame.indices.length; at++) {
      const index=frame.indices[at];
      if (starts[index] > view.end) break;
      const barLeft=Math.max(LEFT,x(starts[index])), barRight=Math.min(width-RIGHT,x(starts[index]+widths[index]));
      const pixel=Math.floor(barLeft), barWidth=Math.max(0.8,barRight-barLeft);
      if (barWidth < 1.2 && pixel===lastPixel) continue;
      lastPixel=pixel;
      context.fillStyle = opcodeColor(selected.group.op_codes[index]);
      roundedRect(barLeft,y,barWidth,BAR);
      painted.push({index,frameIndex,left:barLeft,right:barLeft+barWidth,top:y,bottom:y+BAR});
      const name=opcodeName(selected.group.op_codes[index]);
      context.font = '500 12px "IBM Plex Mono", monospace';
      const textWidth=context.measureText(name).width;
      if (barWidth > textWidth+24) {
        context.fillStyle = '#07171d55'; roundedRect(barLeft+(barWidth-textWidth)/2-6,y+8,textWidth+12,22);
        context.fillStyle = '#f7fafb'; context.textAlign='center'; context.fillText(name,barLeft+barWidth/2,y+BAR/2); context.textAlign='left';
      }
    }
    if (!frame.indices.length && right-left>3) {
      context.strokeStyle='#55686c'; context.setLineDash([3,4]); context.strokeRect(left,y,right-left,BAR); context.setLineDash([]);
      if (right-left>160) { context.fillStyle='#a3b4b7'; context.font='11px "IBM Plex Mono", monospace'; context.fillText(frame.precompile?'Precompile execution':'No EVM opcodes recorded',left+10,y+BAR/2); }
    }
    const bracketY=y+BAR+18;
    context.strokeStyle='#8b9fa4'; context.lineWidth=1.5; context.beginPath();
    context.moveTo(left+1,bracketY-4); context.lineTo(left+1,bracketY+4); context.moveTo(left+1,bracketY); context.lineTo(right-1,bracketY);
    context.moveTo(right-1,bracketY-4); context.lineTo(right-1,bracketY+4); context.stroke();
    context.font='12px "IBM Plex Mono", monospace';
    if (right-left>50) {
      const label=frame.label.split(' / ').map(name => name.split('(')[0]).join(' / ');
      const labelWidth=Math.min(context.measureText(label).width+18,right-left-10);
      const labelLeft=left+(right-left-labelWidth)/2;
      context.fillStyle='#111719'; roundedRect(labelLeft,bracketY-11,labelWidth,22);
      context.save(); context.beginPath(); context.rect(labelLeft+7,bracketY-12,labelWidth-14,24); context.clip();
      context.fillStyle='#d8e3e5'; context.fillText(label,labelLeft+8,bracketY); context.restore();
    }
    painted.push({frameIndex,left,right,top:y+BAR+4,bottom:y+ROW-5});
  }
  context.restore();
}

function hideTooltip() { $('tooltip').hidden=true; $('highlight').style.display='none'; }
function showTooltip(hit, clientX, clientY) {
  active=hit;
  const frame=frames[hit.frameIndex], index=hit.index;
  $('tip-contract').textContent=frame.label.replaceAll(' / ','\n');
  const details=$('tooltip').querySelector('dl'); details.hidden=index===undefined;
  if (index===undefined) {
    $('tip-opcode').textContent=`Depth ${frame.depth}`;
    $('tip-name').textContent=frame.precompile?'Precompile':'Contract call';
    $('tip-scope').textContent=frame.address || '';
  } else {
    const code=selected.group.op_codes[index], weight=selected.group.weights[index];
    $('tip-opcode').textContent=opcodeHex(code);
    $('tip-name').textContent=opcodeName(code);
    $('tip-weight').textContent=duration(weight.ref_time/1000);
    $('tip-proof').textContent=`${whole.format(weight.proof_size)} bytes`;
    $('tip-time').textContent=duration(stats.elapsedMean[index],stats.sd ? stats.sd[index] : null);
    $('tip-scope').textContent=`${whole.format(selected.group.samples.length)} repetitions · Depth ${frame.depth}${CALLS.has(code)?' · Includes nested execution':''}`;
  }
  const tooltip=$('tooltip'); tooltip.hidden=false;
  tooltip.style.left=`${Math.max(12,Math.min(clientX+16,innerWidth-tooltip.offsetWidth-12))}px`;
  tooltip.style.top=`${Math.max(12,Math.min(clientY+18,innerHeight-tooltip.offsetHeight-12))}px`;
  const highlight=$('highlight'); highlight.style.display='block';
  Object.assign(highlight.style,{left:`${hit.left}px`,top:`${hit.top}px`,width:`${Math.max(2,hit.right-hit.left)}px`,height:`${hit.bottom-hit.top}px`});
}
function hitAt(event) {
  const bounds=canvas.getBoundingClientRect(), px=event.clientX-bounds.left, py=event.clientY-bounds.top;
  return painted.find(hit => px>=hit.left && px<=hit.right && py>=hit.top && py<=hit.bottom);
}
function focusHit(hit) {
  const frame=frames[hit.frameIndex];
  const left=hit.index===undefined?frame.start:starts[hit.index];
  const right=hit.index===undefined?frame.endPosition:left+widths[hit.index];
  const padding=Math.max((right-left)*.035,total/1e8);
  setView(left-padding,right+padding);
}

async function selectTransaction() {
  const revision=++loadRevision;
  active=undefined;
  for (const button of $('toolbar').querySelectorAll('button')) button.disabled=true;
  $('chart').hidden=true; $('transaction-totals').hidden=true; $('opcode-summary').hidden=true; $('status').hidden=false;
  $('status').textContent='Averaging the recorded repetitions…'; hideTooltip();
  try {
    const choice=choices[Number($('transaction').value)];
    const calculated=await summarize(choice.group);
    if (revision!==loadRevision) return;
    selected=choice; stats=calculated;
    ({frames,owners}=buildFrames(choice.group,choice.workload));
    maxDepth=frames.reduce((maximum,frame) => Math.max(maximum,frame.depth),0);
    $('title').textContent=choice.workload.name || 'Transaction profile';
    $('configuration').textContent=`EVM · ${modeName(choice.workload.mode)}`;
    $('machine').textContent=machineDescription(report.machine);
    $('repetitions').textContent=`${whole.format(choice.group.samples.length)} repetitions`;
    $('transaction-ref-time').textContent=duration(stats.transactionTotals.refTime/1000);
    $('transaction-execution-time').textContent=duration(stats.transactionTotals.executionTime,stats.transactionTotals.executionSd??undefined);
    renderOpcodeTotals(stats.totals);
    $('chart').hidden=false; $('status').hidden=true;
    layout();
    $('transaction-totals').hidden=false;
    $('opcode-summary').hidden=false;
  } catch (error) {
    $('chart').hidden=true; $('status').hidden=false;
    $('status').textContent=error.message;
    selected=null; frames=null; view=null;
  } finally {
    if (revision===loadRevision) for (const button of $('toolbar').querySelectorAll('button')) button.disabled=!selected;
  }
}

$('transaction').addEventListener('change',selectTransaction);
for (const button of $('opcode-summary').querySelectorAll('button[data-sort]')) button.addEventListener('click',() => {
  opcodeSort = {key:button.dataset.sort, direction:opcodeSort.key===button.dataset.sort && opcodeSort.direction==='ascending'?'descending':'ascending'};
  renderOpcodeTotals(stats.totals);
});
for (const [id,value] of [['ref-time','ref'],['execution-time','time']]) $(id).addEventListener('click',() => {
  metric=value; $('ref-time').setAttribute('aria-pressed',value==='ref'); $('execution-time').setAttribute('aria-pressed',value==='time');
  if (selected) layout();
});
$('zoom-in').addEventListener('click',() => zoom(.5));
$('zoom-out').addEventListener('click',() => zoom(2));
$('fit').addEventListener('click',() => setView(0,total));
canvas.addEventListener('pointerdown',event => {
  drag={x:event.clientX,view:{...view},moved:false}; canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener('pointermove',event => {
  if (drag) {
    const delta=event.clientX-drag.x;
    if (Math.abs(delta)>3) drag.moved=true;
    if (drag.moved) {
      const shift=-delta/(width-LEFT-RIGHT)*(drag.view.end-drag.view.start);
      setView(drag.view.start+shift,drag.view.end+shift);
    }
    return;
  }
  const hit=hitAt(event);
  if (hit) showTooltip(hit,event.clientX,event.clientY); else hideTooltip();
});
canvas.addEventListener('pointerup',event => {
  const clicked=drag && !drag.moved; drag=null;
  if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
  if (clicked) { const hit=hitAt(event); if (hit) focusHit(hit); }
});
canvas.addEventListener('pointercancel',() => { drag=null; hideTooltip(); });
canvas.addEventListener('pointerleave',() => { if (!drag) hideTooltip(); });
canvas.addEventListener('wheel',event => {
  event.preventDefault();
  const fraction=Math.max(0,Math.min(1,(event.clientX-canvas.getBoundingClientRect().left-LEFT)/(width-LEFT-RIGHT)));
  zoom(Math.exp(Math.max(-1,Math.min(1,event.deltaY*.003))),view.start+fraction*(view.end-view.start));
},{passive:false});
canvas.addEventListener('keydown',event => {
  if (event.key==='Home') { event.preventDefault(); setView(0,total); }
  else if (event.key==='Escape') hideTooltip();
  else if (event.key==='+' || event.key==='=') zoom(.5);
  else if (event.key==='-') zoom(2);
  else if (event.key==='Enter' && active) focusHit(active);
  else if (event.key==='ArrowLeft' || event.key==='ArrowRight') {
    event.preventDefault();
    const index=Math.max(0,Math.min(selected.group.op_codes.length-1,(active?.index??0)+(event.key==='ArrowRight'?1:-1)));
    if (starts[index]<view.start || starts[index]+widths[index]>view.end) {
      const span=view.end-view.start; setView(starts[index]-span/3,starts[index]+span*2/3);
    }
    const top=rowY(selected.group.depths[index]);
    const hit={index,frameIndex:owners[index],left:Math.max(LEFT,x(starts[index])),right:Math.min(width-RIGHT,x(starts[index]+widths[index])),top,bottom:top+BAR};
    const bounds=canvas.getBoundingClientRect(); showTooltip(hit,bounds.left+hit.left,bounds.top+top);
  }
});
new ResizeObserver(() => draw()).observe($('chart'));

async function init() {
  try {
    requireValue(typeof REPORT_FILE!=='undefined', 'Generate this page with report-processor generate-profiling-html-report.');
    requireValue(location.protocol!=='file:', 'Serve this HTML and its data file over HTTP to view the profile.');
    const response=await fetch(new URL(encodeURIComponent(REPORT_FILE),location.href));
    requireValue(response.ok, `Could not load profiling data (HTTP ${response.status}).`);
    const stream=response.body.pipeThrough(new DecompressionStream('gzip'));
    report=JSON.parse(await new Response(stream).text());
    choices=report.workloads.flatMap(workload => workload.transactions.map(group => ({workload,group})));
    requireValue(choices.length>0,'No transactions inside repeat steps.');
    for (const [index,choice] of choices.entries()) {
      const option=document.createElement('option'); option.value=String(index);
      option.textContent=`${choice.group.repeat_path} · ${choice.group.entry_point || choice.workload.name || 'Transaction'} · ${choice.group.samples.length} repetitions`;
      $('transaction').append(option);
    }
    $('transaction').value=String(choices.reduce((best,choice,index) => choice.group.samples.length>choices[best].group.samples.length?index:best,0));
    $('toolbar').hidden=false;
    await selectTransaction();
  } catch (error) { $('status').textContent=error.message; }
}
init();
</script>
</body>
</html>
